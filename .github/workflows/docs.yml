name: docs

# Builds the documentation website from docs/ (ADR 0006). A pull request that touches the
# docs gets a build, so a broken link is found before merging; a push to main publishes the
# site to the gh-pages branch.
#
# A release tag publishes it too, because the navbar shows the newest release. GitHub
# doesn't apply the paths filter below to tag pushes, so every release tag runs this.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Every run that publishes shares one group, so a tag run and a main run never push gh-pages
# at once.
concurrency:
  group: docs-${{ github.event_name != 'pull_request' && 'publish' || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Docs site
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push gh-pages; pull requests only build
    steps:
      # Full history, so the navbar can show the newest release tag. Every run that
      # publishes builds main, whatever pushed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs-site/build
          branch: gh-pages
          clean: true
