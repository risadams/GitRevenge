name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (check, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test

  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # main.go embeds frontend/dist, so the frontend must be built before any Go tooling.
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - run: go vet ./...
      - name: go test
        shell: bash
        # The race detector needs cgo: macOS runners have clang, Windows runners have no gcc.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then go test -race ./...; else go test ./...; fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Wails build (Windows)
        if: runner.os == 'Windows'
        run: wails build -s
      - name: Wails build (macOS universal)
        if: runner.os == 'macOS'
        run: wails build -s -platform darwin/universal
