name: Bug report
description: Something doesn't work as expected
labels: [type:bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository…
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Git Revenge version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Other]
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: Git version
      description: Output of `git --version`.
  - type: textarea
    id: repo
    attributes:
      label: About the repository
      description: Rough size (commits, files), and anything unusual such as LFS, submodules, sparse checkout or thousands of refs.
  - type: textarea
    id: extra
    attributes:
      label: Logs and screenshots
      description: Please remove any credentials or private repository names.
